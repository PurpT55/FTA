[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droidtriage"
version = "1.1.0"
description = "Offline Android forensic triage for DroidCollector / adb_collect.sh evidence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []                      # standard library only, on purpose
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Environment :: Console"]

[project.scripts]
droidtriage = "droidtriage.cli:main"

[tool.setuptools]
packages = ["droidtriage"]

[tool.setuptools.package-data]
droidtriage = ["templates/*.html"]
