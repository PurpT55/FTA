[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droidtriage"
version = "1.0.0"
description = "Offline Android forensic triage for DroidCollector / adb_collect.sh evidence"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
droidtriage = "droidtriage.__main__:main"

[tool.setuptools]
packages = ["droidtriage"]
