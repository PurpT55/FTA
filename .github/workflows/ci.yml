name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyzer:
    name: droidtriage tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + end-to-end tests
        working-directory: analyzer
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Real-APK parser tests
        working-directory: analyzer
        run: |
          if curl -fsSL -o /tmp/test.apk https://github.com/emanuele-f/PCAPdroid/releases/download/v1.7.2/PCAPdroid_v1.7.2.apk; then
            DROIDTRIAGE_TEST_APK=/tmp/test.apk python -m unittest tests.test_apk -v
          else
            echo "::warning::test APK download failed; real-APK parser tests skipped"
          fi
      - name: setup.sh / build.sh logic tests
        run: python -m unittest discover -s tools/tests -t . -v
      - name: Project index is up to date
        run: python tools/gen_index.py --check

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck setup.sh tools/*.sh

  setup-linux:
    # The real end-to-end test of ./setup.sh: fresh containers, nothing preinstalled, full build + tests.
    name: setup.sh on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "fedora:41", "archlinux:latest"]
    steps:
      - name: git for checkout
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq git
          elif command -v dnf >/dev/null; then dnf install -y -q git
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed git; fi
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: ./setup.sh (install toolchain, build, test)
        run: ./setup.sh -y --accept-licenses
      - name: Idempotent re-run and status check
        run: ./setup.sh --check
      - name: Build info
        run: cat dist/BUILD_INFO.txt dist/SHA256SUMS

  android:
    name: Android unit tests + APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key (repository secret or throw-away)
        env:
          KEYSTORE_B64: ${{ secrets.SUITE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/suite.keystore
          else
            ./tools/make_keystore.sh
          fi
      - name: Unit tests + build
        working-directory: android
        env:
          SUITE_KEYSTORE_PASSWORD: ${{ secrets.SUITE_KEYSTORE_PASSWORD }}
          SUITE_KEY_ALIAS: ${{ secrets.SUITE_KEY_ALIAS }}
          SUITE_KEY_PASSWORD: ${{ secrets.SUITE_KEY_PASSWORD }}
        run: |
          # empty secrets must not override the defaults of make_keystore.sh
          [ -z "$SUITE_KEYSTORE_PASSWORD" ] && unset SUITE_KEYSTORE_PASSWORD SUITE_KEY_ALIAS SUITE_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon test assembleRelease
          mkdir -p ../out
          cp sentinel/build/outputs/apk/release/*.apk ../out/DroidSentinel.apk
          cp collector/build/outputs/apk/release/*.apk ../out/DroidCollector.apk
          sha256sum ../out/*.apk | tee ../out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: droid-forensics-apks
          path: out/
